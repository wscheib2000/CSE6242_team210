<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js with Flask</title>
    <script src="{{ url_for('static', filename='d3.v5.min.js') }}"></script>
</head>
<body>
    <h2>Python and D3.js Integration</h2>
    <button id="fetch-data">Fetch Data from Python</button>
    <pre id="output"></pre>

    <script>
        document.getElementById('fetch-data').addEventListener('click', () => {
            d3.json('/run_script')
                .then(data => {
                    if (data.error) {
                        document.getElementById('output').textContent = 'Error: ' + data.error;
                    } else {
                        document.getElementById('output').textContent = 'Output: ' + data.output;
                    }
                })
                .catch(error => console.error('Fetch error:', error));
        });
    </script>
</body>
</html>
